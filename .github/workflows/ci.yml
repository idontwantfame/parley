name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Also run by the image publishing workflow, which publishes only on success.
  workflow_call:

# Cancel superseded runs on the same ref (per calling workflow, so the publish
# workflow's test run never cancels — or is cancelled by — this one).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # Node 24+: built-in node:sqlite is unflagged. Project requires >= 22.5.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  sidecar-tests:
    name: STT sidecar tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stt_sidecar
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: stt_sidecar/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        # Tests inject a FakeModel, so no whisper model is downloaded, and fake
        # whisperx/torch: speaker detection (requirements-diarize.txt) is
        # deliberately NOT installed, so this also proves the default image works.
        run: python -m pytest -q
